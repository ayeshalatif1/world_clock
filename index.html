<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>World Clock</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.6.0/moment-timezone-with-data-1970-2030.min.js"></script>
</head>

<body>
    <div class="container">
        <h1>World Clock</h1>
        <select name="cities" id="cities">
            <option value="">Select a City</option>
            <option value="">London</option>
            <option value="">New York</option>
            <option value="">Auckland</option>
        </select>


        <div class="cities">
            <div class="city" id="los-angeles">
                <div>
                    <h2>Los Angeles</h2>
                    <div class="date">August 15th 2022</div>
                </div>
                <div>
                    <div class="time">1:48:15 <small>AM</small></div>
                </div>
            </div>

            <div class="city" id="paris">
                <div>
                    <h2>Paris</h2>
                    <div class="date">August 15th 2022</div>
                </div>
                <div>
                    <div class="time">1:48:15 <small>AM</small></div>
                </div>
            </div>
        </div>
    </div>



    <footer>
        <p>This porject is hosted on <a target="_blank" href="https://github.com/ayeshalatif1/world_clock">GitHub</a>
        </p>
    </footer>

    <script src="index.js"></script>
</body>

</html>
